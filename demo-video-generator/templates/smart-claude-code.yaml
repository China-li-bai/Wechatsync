# 智能视频生成配置 - Claude Code 文档
# 自动分析页面并生成内容

project:
  name: "Claude Code 文档智能演示"
  url: "https://code.claude.com/docs/zh-CN/overview"
  output_dir: "./output/smart-claude-code"
  output_name: "smart-claude-code-demo"

voice:
  language: "zh-CN"
  voice_name: "XiaoxiaoNeural"
  speed: 1.0

# 场景配置 - 可以留空，系统会自动生成
# 如果提供场景，将使用提供的场景
scenes: []

recording:
  enabled: true
  auto_scroll: true
  scroll_distance: 400
  wait_after_action: 2

video:
  format: "mp4"
  quality: "high"
  resolution: "1280x720"
  fps: 30
  codec: "libx264"

audio:
  codec: "aac"
  bitrate: "128k"

subtitle:
  enabled: true
  format: "srt"
  font: "PingFang SC"
  font_size: 24
  color: "#FFFFFF"
  outline_color: "#000000"
  background_color: "#80000000"
  outline: 2
  shadow: 1

thumbnail:
  enabled: true
  template: "default.html"
  template_dir: "templates/thumbnails"
  background: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
  font_size: 80
  text_color: "white"
  badge: "AI"
  brand: "Claude Code"
  author: "Smart Generator"
  accent_color: "#ffd700"

# 高级配置 - 启用智能功能
advanced:
  auto_generate_content: true
  analyze_page: true
  browser:
    headless: true
    timeout: 30000
  validation:
    check_sync: true
    check_quality: true
    max_file_size: 20
  performance:
    parallel_voice: true
    skip_existing: false
