<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{ width }}px;
            height: {{ height }}px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', sans-serif;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.5) 100%);
            z-index: 2;
        }
        
        .content {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }
        
        .title-container {
            text-align: center;
            max-width: 80%;
        }
        
        .title {
            font-size: {{ font_size | default(80) }}px;
            font-weight: 900;
            color: {{ text_color | default('#FFFFFF') }};
            text-shadow: 
                4px 4px 8px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(0, 0, 0, 0.3);
            line-height: 1.2;
            word-wrap: break-word;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        {% if subtitle %}
        .subtitle {
            font-size: {{ font_size // 2 | default(40) }}px;
            font-weight: 700;
            color: {{ text_color | default('#FFFFFF') }};
            opacity: 0.95;
            text-shadow: 
                3px 3px 6px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        {% endif %}
        
        {% if badge %}
        .badge {
            position: absolute;
            top: 40px;
            left: 40px;
            background: {{ accent_color | default('#FFD700') }};
            color: #000;
            padding: 20px 50px;
            border-radius: 40px;
            font-size: 36px;
            font-weight: 900;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        {% endif %}
        
        .glow-effect {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, {{ accent_color | default('#FFD700') }}40 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            animation: glow 4s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.2); }
        }
        
        .sparkle {
            position: absolute;
            width: 40px;
            height: 40px;
            background: {{ accent_color | default('#FFD700') }};
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 2s ease-in-out infinite;
            z-index: 4;
        }
        
        .sparkle:nth-child(1) { top: 10%; right: 15%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 20%; left: 10%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 15%; right: 20%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 25%; left: 15%; animation-delay: 1.5s; }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }
    </style>
</head>
<body>
    <img src="{{ ai_image_url }}" alt="{{ ai_image_alt | default('AI Generated') }}" class="background-image" />
    
    <div class="overlay"></div>
    
    <div class="glow-effect"></div>
    
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    
    {% if badge %}
    <div class="badge">{{ badge }}</div>
    {% endif %}
    
    <div class="content">
        <div class="title-container">
            <div class="title">{{ title }}</div>
            
            {% if subtitle %}
            <div class="subtitle">{{ subtitle }}</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
