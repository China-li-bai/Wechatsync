<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: {{ width | default(1080) }}px;
            height: {{ height | default(1920) }}px;
            background: {{ background | default('linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)') }};
            font-family: 'Georgia', 'Times New Roman', 'Noto Serif SC', 'SimSun', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 神秘深蓝背景 */
        .bg-mystery {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: {{ background | default('linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)') }};
            z-index: 1;
        }

        /* 神秘光晕 */
        .mystery-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: glow-pulse 4s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            padding: 80px 60px;
        }

        /* 顶部秘密标签 */
        {% if badge %}
        .badge-secret {
            position: absolute;
            top: 70px;
            right: 70px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 36px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 
                0 8px 30px rgba(255, 215, 0, 0.4),
                0 0 50px rgba(255, 215, 0, 0.2);
            z-index: 20;
            border: 2px solid #FFF;
            animation: secret-float 3s ease-in-out infinite;
        }

        @keyframes secret-float {
            0%, 100% { transform: translateY(0) rotate(2deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
        }
        {% endif %}

        /* 中央视觉区 */
        .visual-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
        }

        /* 巨型问号 - 好奇触发器 */
        .question-mark {
            font-size: 300px;
            font-weight: 700;
            color: #FFD700;
            line-height: 1;
            text-shadow: 
                0 0 60px rgba(255, 215, 0, 0.5),
                0 0 120px rgba(255, 215, 0, 0.3);
            animation: question-glow 3s ease-in-out infinite;
            margin-bottom: 40px;
        }

        @keyframes question-glow {
            0%, 100% { 
                opacity: 0.8; 
                transform: scale(1);
                text-shadow: 0 0 60px rgba(255, 215, 0, 0.5), 0 0 120px rgba(255, 215, 0, 0.3);
            }
            50% { 
                opacity: 1; 
                transform: scale(1.03);
                text-shadow: 0 0 80px rgba(255, 215, 0, 0.7), 0 0 160px rgba(255, 215, 0, 0.4);
            }
        }

        /* 主标题 */
        .title-curiosity {
            font-size: {{ (font_size | default(78)) }}px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                4px 4px 8px rgba(0,0,0,0.8),
                0 0 30px rgba(255, 215, 0, 0.2);
            max-width: 92%;
            word-wrap: break-word;
            margin-bottom: 50px;
        }

        /* 引号装饰 */
        .title-curiosity::before,
        .title-curiosity::after {
            content: '"';
            color: #FFD700;
            font-size: 1.2em;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* 副标题 - 神秘感 */
        {% if subtitle %}
        .subtitle-mystery {
            font-size: {{ ((font_size | default(78)) * 0.42) }}px;
            font-weight: 500;
            font-style: italic;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
            max-width: 88%;
            padding: 25px 40px;
            background: rgba(0, 0, 0, 0.6);
            border-left: 5px solid #FFD700;
            border-radius: 0 15px 15px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        {% endif %}

        /* 底部悬念文字 */
        .suspense-text {
            margin-top: 60px;
            font-size: 32px;
            font-weight: 600;
            color: #FFD700;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0.8;
            animation: suspense-blink 2s ease-in-out infinite;
        }

        @keyframes suspense-blink {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* 神秘粒子 */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            animation: particle-float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 30%; right: 20%; animation-delay: 1.5s; width: 6px; height: 6px; }
        .particle:nth-child(3) { bottom: 30%; left: 20%; animation-delay: 3s; }
        .particle:nth-child(4) { bottom: 25%; right: 15%; animation-delay: 4.5s; width: 6px; height: 6px; }

        @keyframes particle-float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-20px) scale(1.3); opacity: 0.9; }
        }
    </style>
</head>
<body>
    <div class="bg-mystery"></div>
    <div class="mystery-glow"></div>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        {% if badge %}
        <div class="badge-secret">{{ badge }}</div>
        {% endif %}

        <div class="visual-center">
            <div class="question-mark">?</div>
            
            <div class="title-curiosity">{{ title }}</div>
            
            {% if subtitle %}
            <div class="subtitle-mystery">{{ subtitle }}</div>
            {% endif %}
        </div>

        <div class="suspense-text">{{ suspense_text | default('Find Out Now') }}</div>
    </div>
</body>
</html>
