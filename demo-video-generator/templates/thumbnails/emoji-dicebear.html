<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{ width }}px;
            height: {{ height }}px;
            background: {{ background | default('linear-gradient(135deg, #667eea 0%, #764ba2 100%)') }};
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            padding: 60px;
        }
        
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            z-index: 2;
        }
        
        .right-section {
            flex: 0 0 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .emoji-container {
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: float 3s ease-in-out infinite;
            backdrop-filter: blur(10px);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .emoji-container img {
            width: 280px;
            height: 280px;
            object-fit: contain;
        }
        
        .title {
            font-size: {{ font_size | default(70) }}px;
            font-weight: 900;
            color: {{ text_color | default('#FFFFFF') }};
            text-shadow: 
                4px 4px 8px rgba(0, 0, 0, 0.3),
                0 0 40px rgba(255, 255, 255, 0.3);
            line-height: 1.2;
            max-width: 100%;
            word-wrap: break-word;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        {% if subtitle %}
        .subtitle {
            font-size: {{ font_size // 2 | default(35) }}px;
            font-weight: 700;
            color: {{ text_color | default('#FFFFFF') }};
            opacity: 0.95;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        {% endif %}
        
        {% if badge %}
        .badge {
            position: absolute;
            top: 40px;
            left: 40px;
            background: {{ accent_color | default('#FFD700') }};
            color: #000;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 10;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        {% endif %}
        
        .sparkle {
            position: absolute;
            width: 30px;
            height: 30px;
            background: {{ accent_color | default('#FFD700') }};
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 2s ease-in-out infinite;
            z-index: 5;
        }
        
        .sparkle:nth-child(1) { top: 15%; right: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 30%; left: 15%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 25%; right: 30%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 35%; left: 20%; animation-delay: 1.5s; }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }
        
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            right: -100px;
            transform: translateY(-50%);
            z-index: 1;
            animation: glow 3s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { opacity: 0.5; transform: translateY(-50%) scale(1); }
            50% { opacity: 1; transform: translateY(-50%) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    
    <div class="glow"></div>
    
    {% if badge %}
    <div class="badge">{{ badge }}</div>
    {% endif %}
    
    <div class="left-section">
        <div class="title">{{ title }}</div>
        
        {% if subtitle %}
        <div class="subtitle">{{ subtitle }}</div>
        {% endif %}
    </div>
    
    <div class="right-section">
        <div class="emoji-container">
            <img src="{{ emoji_url }}" alt="{{ emoji_alt | default('emoji') }}" />
        </div>
    </div>
</body>
</html>
