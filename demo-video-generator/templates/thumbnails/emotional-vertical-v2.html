<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: {{ width | default(1080) }}px;
        height: {{ height | default(1920) }}px;
        background: {{ background | default('linear-gradient(180deg, #667eea 0%, #764ba2 100%)') }};
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        padding: 100px 85px;
      }

      .emotion-bg {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: 
          radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12) 0%, transparent 60%),
          radial-gradient(circle at 70% 80%, rgba(255,255,255,0.08) 0%, transparent 50%);
        pointer-events: none;
        z-index: 1;
      }

      .container-mobile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 10;
      }

      {% if badge %}
      .badge-emotion-mobile {
        position: absolute;
        top: 80px;
        left: 80px;
        background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
        color: #1a1a1a;
        padding: 26px 55px;
        border-radius: 35px;
        font-size: 48px;
        font-weight: 800;
        box-shadow:
          0 12px 35px rgba(255, 215, 0, 0.35),
          0 0 65px rgba(255, 215, 0, 0.2),
          inset 0 -4px 0 rgba(0, 0, 0, 0.1);
        text-transform: uppercase;
        letter-spacing: 3px;
        z-index: 20;
        animation: emotion-badge-heartbeat-mobile 2s ease-in-out infinite;
        border: 2px solid rgba(255, 255, 255, 0.25);
      }

      @keyframes emotion-badge-heartbeat-mobile {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.05);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.05);
        }
        60% {
          transform: scale(1);
        }
      }
      {% endif %}

      .emotion-face-container-mobile {
        position: relative;
        width: 450px;
        height: 450px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 55px;
      }

      .emotion-circle-mobile {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
        box-shadow:
          0 25px 60px rgba(0, 0, 0, 0.3),
          inset 0 0 60px rgba(255, 255, 255, 0.08);
        animation: emotion-breathe-mobile 5s ease-in-out infinite;
      }

      @keyframes emotion-breathe-mobile {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.9;
        }
      }

      .emoji-emotion-mobile {
        font-size: 340px;
        line-height: 1;
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
        animation: emotion-express-mobile 4s ease-in-out infinite;
        position: relative;
        z-index: 2;
      }

      @keyframes emotion-express-mobile {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
        }
        33% {
          transform: scale(1.05) rotate(-3deg);
        }
        66% {
          transform: scale(1.02) rotate(3deg);
        }
      }

      .tear-drops-mobile {
        position: absolute;
        top: 110px;
        right: 85px;
        font-size: 48px;
        animation: tear-fall-mobile 2.5s ease-in-out infinite;
        opacity: 0.75;
      }

      @keyframes tear-fall-mobile {
        0% {
          opacity: 0;
          transform: translateY(0) scale(0.4);
        }
        30% {
          opacity: 1;
          transform: translateY(15px) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(50px) scale(0.8);
        }
      }

      .title-emotional-mobile {
        font-size: {{ (font_size | default(72)) * 1.15 }}px;
        font-weight: 800;
        color: #ffffff;
        line-height: 1.35;
        max-width: 90%;
        word-wrap: break-word;
        margin-bottom: 40px;
        letter-spacing: 2px;
        text-shadow:
          3px 3px 12px rgba(0, 0, 0, 0.35),
          0 0 35px rgba(0, 0, 0, 0.15);
      }

      {% if subtitle %}
      .subtitle-emotion-mobile {
        font-size: {{ ((font_size | default(72)) // 2 + 7) * 1.15 }}px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.92);
        line-height: 1.6;
        text-align: center;
        max-width: 88%;
        padding: 28px 45px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        border-radius: 24px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      }
      {% endif %}

      .floating-hearts {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 2;
      }

      .heart {
        position: absolute;
        font-size: 40px;
        opacity: 0.5;
        animation: heart-float 6s ease-in-out infinite;
      }

      .heart:nth-child(1) { top: 20%; left: 12%; animation-delay: 0s; }
      .heart:nth-child(2) { top: 30%; right: 15%; animation-delay: 2s; font-size: 32px; }
      .heart:nth-child(3) { bottom: 25%; left: 18%; animation-delay: 4s; }
      .heart:nth-child(4) { bottom: 18%; right: 12%; animation-delay: 1s; font-size: 36px; }

      @keyframes heart-float {
        0%, 100% {
          transform: translateY(0) scale(1);
          opacity: 0.3;
        }
        50% {
          transform: translateY(-20px) scale(1.1);
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <div class="emotion-bg"></div>
    
    <div class="floating-hearts">
      <div class="heart">✨</div>
      <div class="heart">💫</div>
      <div class="heart">✨</div>
      <div class="heart">💫</div>
    </div>

    <div class="container-mobile">
      {% if badge %}
      <div class="badge-emotion-mobile">{{ badge }}</div>
      {% endif %}

      <div class="emotion-face-container-mobile">
        <div class="emotion-circle-mobile"></div>
        <div class="emoji-emotion-mobile">{{ emoji | default('😭') }}</div>
        <div class="tear-drops-mobile">💧</div>
      </div>

      <div class="title-emotional-mobile">{{ title }}</div>

      {% if subtitle %}
      <div class="subtitle-emotion-mobile">{{ subtitle }}</div>
      {% endif %}
    </div>
  </body>
</html>
