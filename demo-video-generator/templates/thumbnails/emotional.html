<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{ width }}px;
            height: {{ height }}px;
            background: {{ background | default('linear-gradient(135deg, #667eea 0%, #764ba2 100%)') }};
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            padding: 50px 60px;
        }
        
        .left-section {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding-right: 40px;
            z-index: 10;
        }
        
        .right-section {
            flex: 0 0 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .emotion-face-container {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .emotion-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.3),
                inset 0 0 60px rgba(255, 255, 255, 0.1);
            animation: emotion-breathe 4s ease-in-out infinite;
        }
        
        @keyframes emotion-breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        
        .emoji-emotion {
            font-size: 260px;
            line-height: 1;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.4));
            animation: emotion-express 3s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }
        
        @keyframes emotion-express {
            0%, 100% { transform: scale(1) rotate(0deg); }
            33% { transform: scale(1.1) rotate(-5deg); }
            66% { transform: scale(1.05) rotate(5deg); }
        }
        
        .tear-drops {
            position: absolute;
            top: 80px;
            right: 60px;
            font-size: 35px;
            animation: tear-fall 2s ease-in-out infinite;
            opacity: 0.8;
        }
        
        @keyframes tear-fall {
            0%, 100% { 
                opacity: 0; 
                transform: translateY(0) scale(0.5); 
            }
            30% { 
                opacity: 1; 
                transform: translateY(20px) scale(1); 
            }
            70% { 
                opacity: 0.8; 
                transform: translateY(60px) scale(0.8); 
            }
            100% { 
                opacity: 0; 
                transform: translateY(90px) scale(0.3); 
            }
        }
        
        .title-emotional {
            font-size: {{ font_size | default(72) }}px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.2;
            max-width: 100%;
            word-wrap: break-word;
            margin-bottom: 28px;
            text-shadow: 
                4px 4px 12px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
        }
        
        {% if subtitle %}
        .story-box {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 22px 32px;
            border-radius: 16px;
            border-left: 5px solid {{ accent_color | default('#FFD700') }};
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
            max-width: 95%;
            position: relative;
        }
        
        .story-box::before {
            content: '"';
            position: absolute;
            top: -10px;
            left: 15px;
            font-size: 60px;
            color: {{ accent_color | default('#FFD700') }};
            opacity: 0.4;
            font-family: Georgia, serif;
            line-height: 1;
        }
        
        .subtitle-story {
            font-size: {{ (font_size // 2) + 3 | default(36) }}px;
            font-weight: 600;
            font-style: italic;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.45;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }
        {% endif %}
        
        {% if badge %}
        .badge-emotion {
            position: absolute;
            top: 38px;
            left: 38px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000000;
            padding: 16px 42px;
            border-radius: 30px;
            font-size: 30px;
            font-weight: 900;
            box-shadow: 
                0 8px 25px rgba(255, 215, 0, 0.6),
                0 0 50px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 20;
            animation: emotion-badge-heartbeat 1.5s ease-in-out infinite;
        }
        
        @keyframes emotion-badge-heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.08); }
            28% { transform: scale(1); }
            42% { transform: scale(1.08); }
            70% { transform: scale(1); }
        }
        {% endif %}
        
        .heart-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }
        
        .heart {
            position: absolute;
            font-size: 30px;
            animation: heart-float 4s ease-in-out infinite;
            opacity: 0;
        }
        
        .heart:nth-child(1) { bottom: 20%; left: 15%; animation-delay: 0s; font-size: 28px; }
        .heart:nth-child(2) { bottom: 35%; left: 8%; animation-delay: 1s; font-size: 24px; }
        .heart:nth-child(3) { top: 25%; left: 12%; animation-delay: 2s; font-size: 26px; }
        .heart:nth-child(4) { bottom: 28%; left: 22%; animation-delay: 3s; font-size: 22px; }
        
        @keyframes heart-float {
            0% { 
                opacity: 0; 
                transform: translateY(0) scale(0) rotate(0deg); 
            }
            20% { 
                opacity: 0.9; 
                transform: translateY(-30px) scale(1) rotate(-15deg); 
            }
            80% { 
                opacity: 0.7; 
                transform: translateY(-120px) scale(0.9) rotate(15deg); 
            }
            100% { 
                opacity: 0; 
                transform: translateY(-160px) scale(0) rotate(0deg); 
            }
        }
        
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, transparent 70%);
            top: 50%;
            right: -80px;
            transform: translateY(-50%);
            z-index: 1;
            animation: orb-glow 3s ease-in-out infinite;
        }
        
        @keyframes orb-glow {
            0%, 100% { opacity: 0.5; transform: translateY(-50%) scale(1); }
            50% { opacity: 1; transform: translateY(-50%) scale(1.15); }
        }
        
        .sparkles-magic {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #FFFFFF;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle-magic 2s ease-in-out infinite;
            z-index: 8;
        }
        
        .sparkles-magic:nth-child(1) { top: 18%; right: 22%; animation-delay: 0s; }
        .sparkles-magic:nth-child(2) { top: 35%; left: 18%; animation-delay: 0.7s; }
        .sparkles-magic:nth-child(3) { bottom: 22%; right: 28%; animation-delay: 1.4s; }
        .sparkles-magic:nth-child(4) { bottom: 38%; left: 22%; animation-delay: 0.3s; width: 18px; height: 18px; }
        
        @keyframes sparkle-magic {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.1) rotate(180deg); }
        }
        
        .emotional-tagline {
            position: absolute;
            bottom: 42px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    
    <div class="heart-particles">
        <div class="heart">❤️</div>
        <div class="heart">💖</div>
        <div class="heart">💕</div>
        <div class="heart">❤️‍🩹</div>
    </div>
    
    <div class="sparkles-magic"></div>
    <div class="sparkles-magic"></div>
    <div class="sparkles-magic"></div>
    <div class="sparkles-magic"></div>
    
    {% if badge %}
    <div class="badge-emotion">{{ badge }}</div>
    {% endif %}
    
    <div class="left-section">
        <div class="title-emotional">{{ title }}</div>
        
        {% if subtitle %}
        <div class="story-box">
            <div class="subtitle-story">{{ subtitle }}</div>
        </div>
        {% endif %}
    </div>
    
    <div class="right-section">
        <div class="emotion-face-container">
            <div class="emotion-circle"></div>
            <div class="emoji-emotion">{{ emoji | default('😢') }}</div>
            <div class="tear-drops">💧</div>
        </div>
    </div>
    
    <div class="emotional-tagline">{{ tagline | default('✨ EMOTIONAL STORY ✨') }}</div>
</body>
</html>
