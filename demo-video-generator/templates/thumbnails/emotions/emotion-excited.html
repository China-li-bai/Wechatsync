<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情 - 兴奋 🤩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        
        .face-excited {
            width: 400px;
            height: 400px;
            background: #FF69B4;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: excited-bounce 1s ease-in-out infinite;
        }

        @keyframes excited-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        

        .face-excited .eyebrow {
            position: absolute;
            width: 80px;
            height: 12px;
            background: #000;
            border-radius: 6px;
            top: 100px;
        }

        .face-excited .eyebrow.left {
            left: 80px;
            transform: rotate(-25deg);
        }

        .face-excited .eyebrow.right {
            right: 80px;
            transform: rotate(--25deg);
        }
        

        .face-excited .eye {
            position: absolute;
            width: 60px;
            height: 70px;
            background: #FFF;
            border: 5px solid #000;
            top: 140px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: #FFD700;
        }

        .face-excited .eye.left { left: 90px; }
        .face-excited .eye.right { right: 90px; }
        

        .face-excited .mouth {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 60px; border-radius: 0 0 60px 60px; background: #000;
        }
        

        .face-excited .blush {
            position: absolute;
            width: 60px;
            height: 40px;
            background: rgba(255, 182, 193, 0.6);
            border-radius: 50%;
            top: 200px;
        }

        .face-excited .blush.left { left: 60px; }
        .face-excited .blush.right { right: 60px; }
        

        .emotion-label {
            margin-top: 60px;
            font-size: 72px;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        .emotion-emoji {
            font-size: 120px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emotion-emoji">🤩</div>
        <div class="face-excited">
        <div class="eyebrow left"></div>
        <div class="eyebrow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="mouth"></div>
    </div>
        <div class="emotion-label">兴奋 - excited</div>
    </div>
</body>
</html>
