<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情 - 恐惧 😨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        
        .face-fear {
            width: 400px;
            height: 400px;
            background: #E0FFFF;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fear-bounce 1s ease-in-out infinite;
        }

        @keyframes fear-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        

        .face-fear .eyebrow {
            position: absolute;
            width: 80px;
            height: 12px;
            background: #000;
            border-radius: 6px;
            top: 100px;
        }

        .face-fear .eyebrow.left {
            left: 80px;
            transform: rotate(20deg);
        }

        .face-fear .eyebrow.right {
            right: 80px;
            transform: rotate(-20deg);
        }
        

        .face-fear .eye {
            position: absolute;
            width: 60px;
            height: 70px;
            background: #FFF;
            border: 5px solid #000;
            top: 140px;
            border-radius: 50%; width: 70px; height: 80px;
        }

        .face-fear .eye.left { left: 90px; }
        .face-fear .eye.right { right: 90px; }
        

        .face-fear .mouth {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 60px; border-radius: 0 0 60px 60px; background: #000;
        }
        

        .face-fear .sweat {
            position: absolute;
            width: 20px;
            height: 30px;
            background: linear-gradient(to bottom, #E0FFFF, #87CEEB);
            border-radius: 50%;
            top: 80px;
            right: 60px;
            animation: sweat-drop 1s ease-in infinite;
        }

        @keyframes sweat-drop {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(40px); opacity: 0; }
        }
        

        .emotion-label {
            margin-top: 60px;
            font-size: 72px;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        .emotion-emoji {
            font-size: 120px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emotion-emoji">😨</div>
        <div class="face-fear">
        <div class="eyebrow left"></div>
        <div class="eyebrow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
        <div class="sweat"></div>
    </div>
        <div class="emotion-label">恐惧 - fear</div>
    </div>
</body>
</html>
