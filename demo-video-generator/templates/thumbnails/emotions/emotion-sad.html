<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情 - 悲伤 😢</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        
        .face-sad {
            width: 400px;
            height: 400px;
            background: #87CEEB;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: sad-bounce 1s ease-in-out infinite;
        }

        @keyframes sad-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        

        .face-sad .eyebrow {
            position: absolute;
            width: 80px;
            height: 12px;
            background: #000;
            border-radius: 6px;
            top: 100px;
        }

        .face-sad .eyebrow.left {
            left: 80px;
            transform: rotate(25deg);
        }

        .face-sad .eyebrow.right {
            right: 80px;
            transform: rotate(-25deg);
        }
        

        .face-sad .eye {
            position: absolute;
            width: 60px;
            height: 70px;
            background: #FFF;
            border: 5px solid #000;
            top: 140px;
            border-radius: 50% 50% 45% 45%;
        }

        .face-sad .eye.left { left: 90px; }
        .face-sad .eye.right { right: 90px; }
        

        .face-sad .mouth {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px; height: 40px; border-top: 6px solid #000; border-radius: 50% 50% 0 0;
        }
        

        .face-sad .tear {
            position: absolute;
            width: 15px;
            height: 25px;
            background: linear-gradient(to bottom, #87CEEB, #4169E1);
            border-radius: 50%;
            top: 200px;
            animation: tear-fall 1.5s ease-in infinite;
        }

        .face-sad .tear.left { left: 100px; }
        .face-sad .tear.right { right: 100px; animation-delay: 0.5s; }

        @keyframes tear-fall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(50px); opacity: 0; }
        }
        

        .emotion-label {
            margin-top: 60px;
            font-size: 72px;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        .emotion-emoji {
            font-size: 120px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emotion-emoji">😢</div>
        <div class="face-sad">
        <div class="eyebrow left"></div>
        <div class="eyebrow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="tear left"></div>
        <div class="tear right"></div>
        <div class="mouth"></div>
    </div>
        <div class="emotion-label">悲伤 - sad</div>
    </div>
</body>
</html>
