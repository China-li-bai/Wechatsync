<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{ width }}px;
            height: {{ height }}px;
            background: {{ background | default('linear-gradient(135deg, #FFD700 0%, #FFA500 100%)') }};
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 60px;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }
        
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding-right: 40px;
        }
        
        .right-section {
            flex: 0 0 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .face-container {
            position: relative;
            width: 350px;
            height: 350px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(2deg); }
            75% { transform: translateY(-10px) rotate(-2deg); }
        }
        
        .face {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
        }
        
        .title {
            font-size: {{ font_size | default(70) }}px;
            font-weight: 900;
            color: {{ text_color | default('#000000') }};
            text-shadow: 
                3px 3px 6px rgba(255, 255, 255, 0.5),
                0 0 30px rgba(255, 255, 255, 0.3);
            line-height: 1.2;
            max-width: 100%;
            word-wrap: break-word;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        {% if subtitle %}
        .subtitle {
            font-size: {{ font_size // 2 | default(35) }}px;
            font-weight: 700;
            color: {{ text_color | default('#000000') }};
            opacity: 0.95;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
        }
        {% endif %}
        
        {% if badge %}
        .badge {
            position: absolute;
            top: 40px;
            left: 40px;
            background: {{ accent_color | default('#FF4757') }};
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 10;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        {% endif %}
        
        .star {
            position: absolute;
            font-size: 60px;
            animation: twinkle 1.5s ease-in-out infinite;
            z-index: 5;
        }
        
        .star-1 { top: 60px; right: 120px; animation-delay: 0s; }
        .star-2 { bottom: 100px; left: 100px; animation-delay: 0.3s; }
        .star-3 { top: 180px; left: 60px; animation-delay: 0.6s; }
        .star-4 { bottom: 180px; right: 80px; animation-delay: 0.9s; }
        
        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.5; transform: scale(1.3) rotate(20deg); }
        }
        
        .sparkle {
            position: absolute;
            width: 30px;
            height: 30px;
            background: white;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 2s ease-in-out infinite;
        }
        
        .sparkle:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 30%; right: 15%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 25%; left: 30%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 35%; right: 20%; animation-delay: 1.5s; }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }
        
        .rainbow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.1;
            background: linear-gradient(45deg, 
                #FF0000, #FF7F00, #FFFF00, #00FF00, 
                #0000FF, #4B0082, #9400D3);
            animation: rainbow 3s linear infinite;
        }
        
        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="rainbow"></div>
    
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    
    {% if badge %}
    <div class="badge">{{ badge }}</div>
    {% endif %}
    
    <div class="star star-1">⭐</div>
    <div class="star star-2">✨</div>
    <div class="star star-3">🌟</div>
    <div class="star star-4">💫</div>
    
    <div class="container">
        <div class="left-section">
            <div class="title">{{ title }}</div>
            
            {% if subtitle %}
            <div class="subtitle">{{ subtitle }}</div>
            {% endif %}
        </div>
        
        <div class="right-section">
            <div class="face-container">
                <svg class="face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- 脸部 -->
                    <circle cx="100" cy="100" r="85" fill="#FFE4C4" stroke="#000" stroke-width="3"/>
                    
                    <!-- 脸红 -->
                    <ellipse cx="50" cy="120" rx="20" ry="15" fill="#FFB6C1" opacity="0.7"/>
                    <ellipse cx="150" cy="120" rx="20" ry="15" fill="#FFB6C1" opacity="0.7"/>
                    
                    <!-- 眉毛（快乐） -->
                    <path d="M 50 60 Q 70 50, 90 60" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 110 60 Q 130 50, 150 60" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    
                    <!-- 眼睛（快乐） -->
                    <path d="M 55 80 Q 70 70, 85 80" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 115 80 Q 130 70, 145 80" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    
                    <!-- 眼睛高光 -->
                    <circle cx="70" cy="78" r="3" fill="white"/>
                    <circle cx="130" cy="78" r="3" fill="white"/>
                    
                    <!-- 嘴巴（大笑） -->
                    <path d="M 60 120 Q 100 170, 140 120" stroke="#000" stroke-width="4" fill="#8B4513" stroke-linecap="round"/>
                    <path d="M 70 125 Q 100 160, 130 125" fill="#FF6B6B"/>
                    
                    <!-- 牙齿 -->
                    <rect x="80" y="125" width="15" height="10" fill="white" rx="2"/>
                    <rect x="105" y="125" width="15" height="10" fill="white" rx="2"/>
                    
                    <!-- 头发 -->
                    <path d="M 30 60 Q 50 20, 100 15 Q 150 20, 170 60" stroke="#000" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M 40 50 Q 60 25, 100 20 Q 140 25, 160 50" stroke="#000" stroke-width="6" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
