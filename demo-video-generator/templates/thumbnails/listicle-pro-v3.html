<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: {{ width | default(1080) }}px;
            height: {{ height | default(1920) }}px;
            background: {{ background | default('linear-gradient(135deg, #667eea 0%, #764ba2 100%)') }};
            font-family: 'Impact', 'Arial Black', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 渐变背景 */
        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: {{ background | default('linear-gradient(135deg, #667eea 0%, #764ba2 100%)') }};
            z-index: 1;
        }

        /* 装饰圆环 */
        .decoration-ring {
            position: absolute;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            z-index: 2;
        }

        .ring-1 {
            width: 800px;
            height: 800px;
            top: -200px;
            right: -200px;
        }

        .ring-2 {
            width: 600px;
            height: 600px;
            bottom: -150px;
            left: -150px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            padding: 80px 60px;
        }

        /* 顶部数字徽章 - 核心卖点 */
        .number-badge {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            box-shadow: 
                0 15px 50px rgba(255, 215, 0, 0.5),
                0 0 80px rgba(255, 215, 0, 0.3);
            z-index: 20;
            border: 4px solid #FFF;
            animation: number-pulse 2s ease-in-out infinite;
        }

        @keyframes number-pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.08); }
        }

        .number-value {
            font-size: 72px;
            line-height: 1;
        }

        .number-label {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 中央内容区 */
        .content-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            margin-top: 120px;
        }

        /* 列表项展示 */
        .list-preview {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
            width: 100%;
            max-width: 900px;
        }

        .list-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 25px 35px;
            border-radius: 15px;
            border-left: 5px solid #FFD700;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .item-number {
            font-size: 48px;
            font-weight: 900;
            color: #FFD700;
            min-width: 60px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .item-text {
            font-size: 36px;
            font-weight: 700;
            color: #FFFFFF;
            text-align: left;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 主标题 */
        .title-listicle {
            font-size: {{ (font_size | default(80)) }}px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.15;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                4px 4px 0px rgba(0,0,0,0.5),
                -2px -2px 0px rgba(0,0,0,0.3),
                2px -2px 0px rgba(0,0,0,0.3),
                -2px 2px 0px rgba(0,0,0,0.3),
                2px 2px 0px rgba(0,0,0,0.3);
            max-width: 95%;
            word-wrap: break-word;
            margin-bottom: 30px;
        }

        /* 副标题 */
        {% if subtitle %}
        .subtitle-list {
            font-size: {{ ((font_size | default(80)) * 0.4) }}px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.4;
            max-width: 90%;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        {% endif %}

        /* 底部CTA */
        .cta-listicle {
            margin-top: 50px;
            background: linear-gradient(135deg, #FF0000 0%, #FF4444 100%);
            color: #FFF;
            padding: 25px 60px;
            border-radius: 50px;
            font-size: 40px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 
                0 10px 40px rgba(255, 0, 0, 0.5),
                0 0 60px rgba(255, 0, 0, 0.3);
            animation: cta-shake 1.5s ease-in-out infinite;
            border: 3px solid #FFF;
        }

        @keyframes cta-shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-1deg); }
            75% { transform: rotate(1deg); }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="decoration-ring ring-1"></div>
    <div class="decoration-ring ring-2"></div>

    <div class="container">
        <!-- 数字徽章 -->
        <div class="number-badge">
            <div class="number-value">{{ list_number | default('5') }}</div>
            <div class="number-label">TIPS</div>
        </div>

        <div class="content-center">
            <!-- 列表预览 -->
            <div class="list-preview">
                <div class="list-item">
                    <div class="item-number">1</div>
                    <div class="item-text">{{ item_1 | default('First Secret') }}</div>
                </div>
                <div class="list-item">
                    <div class="item-number">2</div>
                    <div class="item-text">{{ item_2 | default('Second Trick') }}</div>
                </div>
                <div class="list-item">
                    <div class="item-number">3</div>
                    <div class="item-text">{{ item_3 | default('Third Method') }}</div>
                </div>
            </div>

            <div class="title-listicle">{{ title }}</div>
            
            {% if subtitle %}
            <div class="subtitle-list">{{ subtitle }}</div>
            {% endif %}
        </div>

        <div class="cta-listicle">{{ cta_text | default('Watch Now') }}</div>
    </div>
</body>
</html>
