<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{ width }}px;
            height: {{ height }}px;
            background: {{ background | default('linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%)') }};
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 70px 90px;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }
        
        .title-mega {
            font-size: {{ font_size | default(95) }}px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.05;
            max-width: 95%;
            word-wrap: break-word;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 
                8px 8px 0px {{ accent_color | default('#FFD700') }},
                -3px -3px 0px {{ accent_color | default('#FFD700') }},
                3px -3px 0px {{ accent_color | default('#FFD700') }},
                -3px 3px 0px {{ accent_color | default('#FFD700') }},
                0 0 80px rgba(255, 215, 0, 0.4);
            margin-bottom: 35px;
            position: relative;
        }
        
        .title-mega::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 5px;
            background: linear-gradient(to right, transparent, {{ accent_color | default('#FFD700') }}, transparent);
            animation: underline-glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes underline-glow {
            0% { 
                opacity: 0.5; 
                width: 50%; 
            }
            100% { 
                opacity: 1; 
                width: 70%; 
            }
        }
        
        {% if subtitle %}
        .subtitle-impact {
            font-size: {{ (font_size // 2) + 8 | default(48) }}px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.3;
            max-width: 88%;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 
                3px 3px 10px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(255, 215, 0, 0.2);
        }
        {% endif %}
        
        {% if badge %}
        .badge-impact {
            position: absolute;
            top: 40px;
            right: 40px;
            background: {{ accent_color | default('#FFD700') }};
            color: #000000;
            padding: 18px 45px;
            clip-path: polygon(10% 0%, 100% 0%, 100% 70%, 90% 100%, 0% 100%, 0% 30%);
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 20;
            animation: impact-badge-flash 2s ease-in-out infinite;
        }
        
        @keyframes impact-badge-flash {
            0%, 100% { 
                opacity: 1; 
                box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5); 
            }
            50% { 
                opacity: 0.85; 
                box-shadow: 
                    0 10px 30px rgba(255, 215, 0, 0.5),
                    0 0 60px rgba(255, 215, 0, 0.7); 
            }
        }
        {% endif %}
        
        .geometric-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .shape {
            position: absolute;
            border: 3px solid {{ accent_color | default('#FFD700') }};
            opacity: 0.25;
        }
        
        .shape-circle {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            top: -150px;
            right: -100px;
            animation: shape-rotate 20s linear infinite;
        }
        
        .shape-square {
            width: 250px;
            height: 250px;
            bottom: -80px;
            left: -80px;
            transform: rotate(45deg);
            animation: shape-pulse 4s ease-in-out infinite;
        }
        
        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 260px solid transparent;
            border-bottom-color: transparent;
            top: 50%;
            left: -100px;
            transform: translateY(-50%);
            border: none;
            opacity: 0;
        }
        
        .triangle-svg {
            position: absolute;
            top: 40%;
            left: -80px;
            width: 200px;
            height: 200px;
            animation: triangle-spin 15s linear infinite;
        }
        
        @keyframes shape-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes shape-pulse {
            0%, 100% { transform: rotate(45deg) scale(1); opacity: 0.25; }
            50% { transform: rotate(45deg) scale(1.1); opacity: 0.35; }
        }
        
        @keyframes triangle-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                linear-gradient(rgba(255, 215, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 2;
            animation: grid-move 10s linear infinite;
        }
        
        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }
        
        .corner-accent {
            position: absolute;
            width: 120px;
            height: 120px;
            z-index: 3;
        }
        
        .corner-accent-tl {
            top: 25px;
            left: 25px;
            border-top: 5px solid {{ accent_color | default('#FFD700') }};
            border-left: 5px solid {{ accent_color | default('#FFD700') }};
        }
        
        .corner-accent-br {
            bottom: 25px;
            right: 25px;
            border-bottom: 5px solid {{ accent_color | default('#FFD700') }};
            border-right: 5px solid {{ accent_color | default('#FFD700') }};
        }
        
        .number-highlight {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }
        
        .stat-box {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid {{ accent_color | default('#FFD700') }};
            padding: 12px 28px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 900;
            color: {{ accent_color | default('#FFD700') }};
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        
        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    
    <div class="geometric-shapes">
        <div class="shape shape-circle"></div>
        <div class="shape shape-square"></div>
        <svg class="triangle-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,10 90,90 10,90" fill="none" stroke="{{ accent_color | default('#FFD700') }}" stroke-width="2" opacity="0.25"/>
        </svg>
    </div>
    
    <div class="corner-accent corner-accent-tl"></div>
    <div class="corner-accent corner-accent-br"></div>
    
    {% if badge %}
    <div class="badge-impact">{{ badge }}</div>
    {% endif %}
    
    <div class="container">
        <div class="title-mega">{{ title }}</div>
        
        {% if subtitle %}
        <div class="subtitle-impact">{{ subtitle }}</div>
        {% endif %}
    </div>
    
    {% if show_stats %}
    <div class="number-highlight">
        <div class="stat-box">
            <div class="stat-number">{{ stat_1_number | default('10M+') }}</div>
            <div class="stat-label">{{ stat_1_label | default('VIEWS') }}</div>
        </div>
        <div class="stat-box">
            <div class="stat-number">{{ stat_2_number | default('98%') }}</div>
            <div class="stat-label">{{ stat_2_label | default('LIKED') }}</div>
        </div>
    </div>
    {% endif %}
</body>
</html>
