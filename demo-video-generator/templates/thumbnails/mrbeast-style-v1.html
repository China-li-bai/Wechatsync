<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bebas+Neue&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: {{ width | default(1080) }}px;
            height: {{ height | default(1920) }}px;
            background: {{ background | default('#FF0000') }};
            font-family: 'Oswald', 'Bebas Neue', 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* MrBeast标志性红色背景 */
        .mrbeast-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: {{ background | default('#FF0000') }};
            z-index: 1;
        }

        /* 微妙纹理增加质感 */
        .mrbeast-texture {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 70%, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(0,0,0,0.1) 0%, transparent 40%);
            z-index: 2;
        }

        /* 主容器 */
        .mrbeast-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
            padding: 40px;
        }

        /* 顶部徽章 */
        {% if badge %}
        .mrbeast-badge {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            padding: 15px 40px;
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-radius: 50px;
            box-shadow: 
                0 10px 40px rgba(255, 215, 0, 0.5),
                0 0 60px rgba(255, 215, 0, 0.3),
                inset 0 -5px 10px rgba(0,0,0,0.1);
            border: 4px solid #FFF;
            z-index: 20;
            animation: badge-pulse 1.5s ease-in-out infinite;
        }

        @keyframes badge-pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.08); }
        }
        {% endif %}

        /* 主视觉区域 */
        .visual-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: 80px;
        }

        /* ============================================
           MrBeast风格震惊表情
           ============================================ */
        .mrbeast-face {
            width: 500px;
            height: 500px;
            position: relative;
            margin-bottom: 30px;
            animation: face-entrance 0.6s ease-out;
        }

        @keyframes face-entrance {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .face-shocked {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 
                0 30px 80px rgba(0,0,0,0.4),
                inset 0 -30px 60px rgba(0,0,0,0.15),
                0 0 100px rgba(255, 215, 0, 0.4);
            animation: face-bounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes face-bounce {
            0% { transform: scale(1) rotate(-1deg); }
            100% { transform: scale(1.05) rotate(1deg); }
        }

        /* 眼睛 - MrBeast风格超大 */
        .face-shocked .eye {
            position: absolute;
            width: 100px;
            height: 120px;
            background: #FFF;
            border-radius: 50%;
            top: 120px;
            border: 8px solid #000;
            animation: eye-pop 0.4s ease-in-out infinite alternate;
            overflow: hidden;
        }

        .face-shocked .eye.left { left: 100px; }
        .face-shocked .eye.right { right: 100px; }

        @keyframes eye-pop {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(1.2); }
        }

        /* 瞳孔 */
        .face-shocked .pupil {
            position: absolute;
            width: 40px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            animation: pupil-shake 0.15s ease-in-out infinite;
        }

        @keyframes pupil-shake {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-3px); }
        }

        /* 高光 */
        .face-shocked .highlight {
            position: absolute;
            width: 18px;
            height: 20px;
            background: #FFF;
            border-radius: 50%;
            top: 40px;
            left: 55%;
        }

        /* 眉毛 - 高挑 */
        .face-shocked .eyebrow {
            position: absolute;
            width: 90px;
            height: 20px;
            background: #000;
            border-radius: 10px;
            top: 70px;
            animation: eyebrow-raise 0.5s ease-in-out infinite alternate;
        }

        .face-shocked .eyebrow.left { 
            left: 105px; 
            transform: rotate(-25deg);
        }
        .face-shocked .eyebrow.right { 
            right: 105px; 
            transform: rotate(25deg);
        }

        @keyframes eyebrow-raise {
            0% { top: 70px; }
            100% { top: 45px; }
        }

        /* 嘴巴 - 超大O型 */
        .face-shocked .mouth {
            position: absolute;
            width: 120px;
            height: 150px;
            background: #000;
            border-radius: 50%;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            animation: mouth-open 0.5s ease-in-out infinite alternate;
            overflow: hidden;
        }

        @keyframes mouth-open {
            0% { height: 130px; width: 110px; }
            100% { height: 170px; width: 130px; }
        }

        /* 舌头 */
        .face-shocked .tongue {
            position: absolute;
            width: 80px;
            height: 70px;
            background: linear-gradient(to bottom, #FF6B6B, #FF4444);
            border-radius: 50%;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            animation: tongue-wiggle 0.3s ease-in-out infinite alternate;
        }

        @keyframes tongue-wiggle {
            0% { transform: translateX(-50%) rotate(-5deg); }
            100% { transform: translateX(-50%) rotate(5deg); }
        }

        /* 汗珠 */
        .face-shocked .sweat {
            position: absolute;
            width: 40px;
            height: 55px;
            background: linear-gradient(to bottom, #87CEEB, #4169E1);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 80px;
            right: 60px;
            animation: sweat-drop 0.8s ease-in-out infinite;
        }

        @keyframes sweat-drop {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(50px) scale(0.7); opacity: 0; }
        }

        /* ============================================
           MrBeast风格标题
           ============================================ */
        .mrbeast-title {
            font-size: {{ (font_size | default(100)) }}px;
            font-weight: 900;
            color: #FFFFFF;
            text-transform: uppercase;
            line-height: 1.0;
            letter-spacing: 2px;
            text-align: center;
            max-width: 95%;
            word-wrap: break-word;
            text-shadow: 
                6px 6px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                3px 3px 0 #000,
                0 0 40px rgba(0,0,0,0.6),
                0 0 80px rgba(0,0,0,0.3);
            animation: title-shake 0.6s ease-in-out infinite alternate;
            margin-bottom: 30px;
        }

        @keyframes title-shake {
            0% { transform: rotate(-0.5deg) scale(1); }
            100% { transform: rotate(0.5deg) scale(1.02); }
        }

        /* 副标题 */
        {% if subtitle %}
        .mrbeast-subtitle {
            font-size: {{ ((font_size | default(100)) * 0.5) }}px;
            font-weight: 700;
            color: #FFD700;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 
                4px 4px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000,
                0 0 30px rgba(0,0,0,0.5);
            animation: subtitle-glow 2s ease-in-out infinite alternate;
        }

        @keyframes subtitle-glow {
            0% { text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 30px rgba(255, 215, 0, 0.3); }
            100% { text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 50px rgba(255, 215, 0, 0.6); }
        }
        {% endif %}

        /* CTA按钮 */
        .mrbeast-cta {
            margin-top: 40px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            padding: 25px 60px;
            font-size: 52px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-radius: 20px;
            border: 5px solid #FFF;
            box-shadow: 
                0 15px 50px rgba(255, 215, 0, 0.5),
                0 0 60px rgba(255, 215, 0, 0.3);
            animation: cta-pulse 1s ease-in-out infinite;
        }

        @keyframes cta-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 15px 50px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 20px 60px rgba(255, 215, 0, 0.7), 0 0 80px rgba(255, 215, 0, 0.5); }
        }

        /* 角落装饰 */
        .corner-decoration {
            position: absolute;
            font-size: 80px;
            opacity: 0.3;
            animation: corner-float 3s ease-in-out infinite;
        }

        .corner-tl { top: 150px; left: 30px; animation-delay: 0s; }
        .corner-tr { top: 150px; right: 30px; animation-delay: 0.5s; }
        .corner-bl { bottom: 200px; left: 30px; animation-delay: 1s; }
        .corner-br { bottom: 200px; right: 30px; animation-delay: 1.5s; }

        @keyframes corner-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="mrbeast-bg"></div>
    <div class="mrbeast-texture"></div>

    <!-- 角落装饰 -->
    <div class="corner-decoration corner-tl">⚡</div>
    <div class="corner-decoration corner-tr">⚡</div>
    <div class="corner-decoration corner-bl">⚡</div>
    <div class="corner-decoration corner-br">⚡</div>

    <div class="mrbeast-container">
        {% if badge %}
        <div class="mrbeast-badge">{{ badge }}</div>
        {% endif %}

        <div class="visual-area">
            <!-- MrBeast风格震惊表情 -->
            <div class="mrbeast-face">
                <div class="face-shocked">
                    <div class="eyebrow left"></div>
                    <div class="eyebrow right"></div>
                    <div class="eye left">
                        <div class="pupil"></div>
                        <div class="highlight"></div>
                    </div>
                    <div class="eye right">
                        <div class="pupil"></div>
                        <div class="highlight"></div>
                    </div>
                    <div class="mouth">
                        <div class="tongue"></div>
                    </div>
                    <div class="sweat"></div>
                </div>
            </div>
            
            <div class="mrbeast-title">{{ title }}</div>
            
            {% if subtitle %}
            <div class="mrbeast-subtitle">{{ subtitle }}</div>
            {% endif %}

            <div class="mrbeast-cta">{{ cta_text | default('WATCH NOW') }}</div>
        </div>
    </div>
</body>
</html>
