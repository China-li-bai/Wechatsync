<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{ width }}px;
            height: {{ height }}px;
            background: {{ background | default('linear-gradient(135deg, #FF4757 0%, #FF6B81 100%)') }};
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 60px;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }
        
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding-right: 40px;
        }
        
        .right-section {
            flex: 0 0 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .face-container {
            position: relative;
            width: 350px;
            height: 350px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .face {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
        }
        
        .title {
            font-size: {{ font_size | default(70) }}px;
            font-weight: 900;
            color: {{ text_color | default('#FFFFFF') }};
            text-shadow: 
                4px 4px 8px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(255, 255, 255, 0.3);
            line-height: 1.2;
            max-width: 100%;
            word-wrap: break-word;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        {% if subtitle %}
        .subtitle {
            font-size: {{ font_size // 2 | default(35) }}px;
            font-weight: 700;
            color: {{ text_color | default('#FFFFFF') }};
            opacity: 0.95;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
        }
        {% endif %}
        
        {% if badge %}
        .badge {
            position: absolute;
            top: 40px;
            left: 40px;
            background: {{ accent_color | default('#FFD700') }};
            color: #000;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 10;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        {% endif %}
        
        .emoji {
            position: absolute;
            font-size: 80px;
            animation: bounce 1s ease-in-out infinite;
            z-index: 5;
        }
        
        .emoji-1 { top: 50px; right: 100px; animation-delay: 0s; }
        .emoji-2 { bottom: 80px; left: 80px; animation-delay: 0.3s; }
        .emoji-3 { top: 150px; left: 50px; animation-delay: 0.6s; }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(10deg); }
        }
        
        .explosion {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        .explosion-line {
            position: absolute;
            width: 4px;
            height: 100px;
            background: linear-gradient(to top, transparent, {{ accent_color | default('#FFD700') }});
            animation: explode 1.5s ease-out infinite;
        }
        
        .explosion-line:nth-child(1) { top: 0; left: 10%; transform: rotate(15deg); animation-delay: 0s; }
        .explosion-line:nth-child(2) { top: 0; right: 10%; transform: rotate(-15deg); animation-delay: 0.2s; }
        .explosion-line:nth-child(3) { bottom: 0; left: 20%; transform: rotate(-20deg); animation-delay: 0.4s; }
        .explosion-line:nth-child(4) { bottom: 0; right: 20%; transform: rotate(20deg); animation-delay: 0.6s; }
        .explosion-line:nth-child(5) { top: 20%; left: 0; transform: rotate(75deg); animation-delay: 0.8s; }
        .explosion-line:nth-child(6) { top: 20%; right: 0; transform: rotate(-75deg); animation-delay: 1s; }
        
        @keyframes explode {
            0% { opacity: 0; transform: scaleY(0); }
            50% { opacity: 1; transform: scaleY(1); }
            100% { opacity: 0; transform: scaleY(0); }
        }
        
        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: {{ accent_color | default('#FFD700') }};
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 2s ease-in-out infinite;
        }
        
        .sparkle:nth-child(1) { top: 15%; left: 15%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 25%; right: 20%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 20%; left: 25%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 30%; right: 15%; animation-delay: 1.5s; }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="explosion">
        <div class="explosion-line"></div>
        <div class="explosion-line"></div>
        <div class="explosion-line"></div>
        <div class="explosion-line"></div>
        <div class="explosion-line"></div>
        <div class="explosion-line"></div>
    </div>
    
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    
    {% if badge %}
    <div class="badge">{{ badge }}</div>
    {% endif %}
    
    <div class="emoji emoji-1">😱</div>
    <div class="emoji emoji-2">😲</div>
    <div class="emoji emoji-3">🤯</div>
    
    <div class="container">
        <div class="left-section">
            <div class="title">{{ title }}</div>
            
            {% if subtitle %}
            <div class="subtitle">{{ subtitle }}</div>
            {% endif %}
        </div>
        
        <div class="right-section">
            <div class="face-container">
                <svg class="face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- 脸部 -->
                    <circle cx="100" cy="100" r="85" fill="#FFE4C4" stroke="#000" stroke-width="3"/>
                    
                    <!-- 脸红 -->
                    <ellipse cx="50" cy="120" rx="20" ry="15" fill="#FFB6C1" opacity="0.6"/>
                    <ellipse cx="150" cy="120" rx="20" ry="15" fill="#FFB6C1" opacity="0.6"/>
                    
                    <!-- 眉毛（惊讶） -->
                    <path d="M 50 55 Q 70 45, 90 55" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 110 55 Q 130 45, 150 55" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    
                    <!-- 眼睛（惊讶） -->
                    <ellipse cx="70" cy="80" rx="18" ry="22" fill="white" stroke="#000" stroke-width="2"/>
                    <ellipse cx="130" cy="80" rx="18" ry="22" fill="white" stroke="#000" stroke-width="2"/>
                    
                    <!-- 瞳孔（惊讶） -->
                    <circle cx="70" cy="80" r="10" fill="#000"/>
                    <circle cx="130" cy="80" r="10" fill="#000"/>
                    
                    <!-- 眼睛高光 -->
                    <circle cx="75" cy="75" r="4" fill="white"/>
                    <circle cx="135" cy="75" r="4" fill="white"/>
                    
                    <!-- 嘴巴（惊讶） -->
                    <ellipse cx="100" cy="145" rx="30" ry="35" fill="#8B4513" stroke="#000" stroke-width="2"/>
                    <ellipse cx="100" cy="155" rx="20" ry="20" fill="#FF6B6B"/>
                    
                    <!-- 头发 -->
                    <path d="M 30 60 Q 50 20, 100 15 Q 150 20, 170 60" stroke="#000" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M 40 50 Q 60 25, 100 20 Q 140 25, 160 50" stroke="#000" stroke-width="6" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
