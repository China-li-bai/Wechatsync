<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: {{ width | default(1080) }}px;
        height: {{ height | default(1920) }}px;
        background: {{ background | default('linear-gradient(180deg, #FF416C 0%, #FF4B2B 100%)') }};
        font-family: 'Impact', 'Arial Black', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        padding: 90px 75px;
      }

      .urgency-bg {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: 
          repeating-linear-gradient(
            45deg,
            transparent,
            transparent 100px,
            rgba(0, 0, 0, 0.05) 100px,
            rgba(0, 0, 0, 0.05) 200px
          );
        animation: bg-slide 20s linear infinite;
        pointer-events: none;
        z-index: 1;
      }

      @keyframes bg-slide {
        0% { background-position: 0 0; }
        100% { background-position: 200px 200px; }
      }

      .container-mobile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 10;
      }

      {% if badge %}
      .badge-urgency-mobile {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #ffd700 0%, #ff6b35 100%);
        color: #1a1a1a;
        padding: 24px 60px;
        border-radius: 50px;
        font-size: 48px;
        font-weight: 900;
        box-shadow:
          0 12px 40px rgba(255, 69, 0, 0.5),
          0 0 70px rgba(255, 215, 0, 0.35);
        text-transform: uppercase;
        letter-spacing: 4px;
        z-index: 20;
        animation: urgency-shake-mobile 1.2s ease-in-out infinite;
        border: 3px solid rgba(255, 255, 255, 0.25);
      }

      @keyframes urgency-shake-mobile {
        0%,
        100% {
          transform: translateX(-50%) rotate(0deg);
        }
        25% {
          transform: translateX(-50%) rotate(-1.5deg);
        }
        75% {
          transform: translateX(-50%) rotate(1.5deg);
        }
      }
      {% endif %}

      .timer-box-mobile {
        background: rgba(0, 0, 0, 0.85);
        border: 6px solid {{ accent_color | default('#FFD700') }};
        border-radius: 24px;
        padding: 30px 55px;
        margin-bottom: 50px;
        box-shadow:
          0 18px 45px rgba(0, 0, 0, 0.55),
          0 0 80px rgba(255, 215, 0, 0.25);
        animation: timer-glow-mobile 1.5s ease-in-out infinite alternate;
      }

      @keyframes timer-glow-mobile {
        0% {
          box-shadow:
            0 18px 45px rgba(0, 0, 0, 0.55),
            0 0 80px rgba(255, 215, 0, 0.25);
        }
        100% {
          box-shadow:
            0 18px 45px rgba(0, 0, 0, 0.55),
            0 0 110px rgba(255, 215, 0, 0.45);
        }
      }

      .timer-label-mobile {
        font-size: 32px;
        color: {{ accent_color | default('#FFD700') }};
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 15px;
        font-weight: 700;
        opacity: 0.9;
      }

      .timer-display-mobile {
        font-size: 88px;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        letter-spacing: 6px;
        animation: countdown-pulse-mobile 1.2s ease-in-out infinite;
      }

      @keyframes countdown-pulse-mobile {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.04);
          opacity: 0.9;
        }
      }

      .title-urgent-mobile {
        font-size: {{ (font_size | default(68)) * 1.15 }}px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.25;
        max-width: 90%;
        word-wrap: break-word;
        margin-bottom: 40px;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-shadow:
          5px 5px 10px rgba(0, 0, 0, 0.35),
          0 0 45px rgba(0, 0, 0, 0.15);
      }

      {% if subtitle %}
      .subtitle-urgent-mobile {
        font-size: {{ ((font_size | default(68)) // 2 + 5) * 1.2 }}px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.92);
        line-height: 1.5;
        text-align: center;
        max-width: 88%;
        padding: 20px 35px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 16px;
        border: 2px solid rgba(255, 215, 0, 0.3);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
      }
      {% endif %}

      .urgency-stripes {
        position: absolute;
        width: 100%;
        height: 8px;
        background: repeating-linear-gradient(
          90deg,
          {{ accent_color | default('#FFD700') }},
          {{ accent_color | default('#FFD700') }} 40px,
          transparent 40px,
          transparent 80px
        );
        opacity: 0.4;
        animation: stripe-move 3s linear infinite;
      }

      .urgency-stripes.top { top: 0; }
      .urgency-stripes.bottom { bottom: 0; animation-direction: reverse; }

      @keyframes stripe-move {
        0% { background-position: 0 0; }
        100% { background-position: 80px 0; }
      }
    </style>
  </head>

  <body>
    <div class="urgency-bg"></div>
    <div class="urgency-stripes top"></div>
    <div class="urgency-stripes bottom"></div>

    <div class="container-mobile">
      {% if badge %}
      <div class="badge-urgency-mobile">{{ badge }}</div>
      {% endif %}

      <div class="timer-box-mobile">
        <div class="timer-label-mobile">LIMITED TIME</div>
        <div class="timer-display-mobile">24:00:00</div>
      </div>

      <div class="title-urgent-mobile">{{ title }}</div>

      {% if subtitle %}
      <div class="subtitle-urgent-mobile">{{ subtitle }}</div>
      {% endif %}
    </div>
  </body>
</html>
