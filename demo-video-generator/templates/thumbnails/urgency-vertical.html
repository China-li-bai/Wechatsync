<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: {{ width | default(1080) }}px;
        height: {{ height | default(1920) }}px;
        background: {{ background | default('linear-gradient(180deg, #FF416C 0%, #FF4B2B 100%)') }};
        font-family: 'Impact', 'Arial Black', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        padding: 80px 70px;
      }

      .container-mobile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 10;
      }

      {% if badge %}
      .badge-urgency-mobile {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #ffd700 0%, #ff4500 100%);
        color: #000000;
        padding: 28px 65px;
        border-radius: 60px;
        font-size: 52px;
        font-weight: 900;
        box-shadow:
          0 18px 45px rgba(255, 69, 0, 0.7),
          0 0 90px rgba(255, 215, 0, 0.6);
        text-transform: uppercase;
        letter-spacing: 5px;
        z-index: 20;
        animation: urgency-shake-mobile 0.8s ease-in-out infinite;
      }

      @keyframes urgency-shake-mobile {
        0%,
        100% {
          transform: translateX(-50%) rotate(0deg);
        }
        25% {
          transform: translateX(-50%) rotate(-2deg);
        }
        75% {
          transform: translateX(-50%) rotate(2deg);
        }
      }
      {% endif %}

      .timer-box-mobile {
        background: rgba(0, 0, 0, 0.92);
        border: 8px solid {{ accent_color | default('#FFD700') }};
        border-radius: 28px;
        padding: 35px 60px;
        margin-bottom: 55px;
        box-shadow:
          0 25px 55px rgba(0, 0, 0, 0.7),
          0 0 100px rgba(255, 215, 0, 0.4);
        animation: timer-glow-mobile 1s ease-in-out infinite alternate;
      }

      @keyframes timer-glow-mobile {
        0% {
          box-shadow:
            0 25px 55px rgba(0, 0, 0, 0.7),
            0 0 100px rgba(255, 215, 0, 0.4);
        }
        100% {
          box-shadow:
            0 25px 55px rgba(0, 0, 0, 0.7),
            0 0 140px rgba(255, 215, 0, 0.7);
        }
      }

      .timer-label-mobile {
        font-size: 36px;
        color: {{ accent_color | default('#FFD700') }};
        text-transform: uppercase;
        letter-spacing: 5px;
        margin-bottom: 18px;
        font-weight: 700;
      }

      .timer-display-mobile {
        font-size: 96px;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
        letter-spacing: 8px;
        animation: countdown-pulse-mobile 1s ease-in-out infinite;
      }

      @keyframes countdown-pulse-mobile {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.9;
        }
      }

      .title-urgent-mobile {
        font-size: {{ (font_size | default(68)) * 1.45 }}px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.2;
        max-width: 92%;
        word-wrap: break-word;
        margin-bottom: 45px;
        text-transform: uppercase;
        letter-spacing: 5px;
        text-shadow:
          8px 8px 0px #000000,
          -3px -3px 0px #000000,
          3px -3px 0px #000000,
          -3px 3px 0px #000000,
          0 0 60px rgba(0, 0, 0, 0.9);
      }

      {% if subtitle %}
      .subtitle-urgent-mobile {
        font-size: {{ ((font_size | default(68)) // 2 + 2) * 1.35 }}px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.35;
        max-width: 88%;
        background: rgba(0, 0, 0, 0.8);
        padding: 28px 40px;
        border-radius: 18px;
        border-left: 10px solid {{ accent_color | default('#FFD700') }};
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
        text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.9);
      }
      {% endif %}

      .warning-stripes-mobile {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 35px;
        background: repeating-linear-gradient(
          45deg,
          #ffd700,
          #ffd700 40px,
          #000000 40px,
          #000000 80px
        );
        z-index: 15;
        animation: stripes-move-mobile 1s linear infinite;
      }

      @keyframes stripes-move-mobile {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 80px 0;
        }
      }

      .alert-icons-mobile {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 40px;
        z-index: 10;
      }

      .alert-icon-mobile {
        font-size: 70px;
        animation: alert-bounce-mobile 1.2s ease-in-out infinite;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
      }

      .alert-icon-mobile:nth-child(1) {
        animation-delay: 0s;
      }
      .alert-icon-mobile:nth-child(2) {
        animation-delay: 0.3s;
      }
      .alert-icon-mobile:nth-child(3) {
        animation-delay: 0.6s;
      }

      @keyframes alert-bounce-mobile {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-15px) scale(1.2);
        }
      }

      .speed-lines-mobile {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }

      .speed-line-mobile {
        position: absolute;
        height: 6px;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.5), transparent);
        animation: speed-rush-mobile 0.9s linear infinite;
      }

      .speed-line-mobile:nth-child(1) {
        top: 25%;
        width: 70%;
        left: -70%;
        animation-delay: 0s;
      }
      .speed-line-mobile:nth-child(2) {
        top: 45%;
        width: 90%;
        left: -90%;
        animation-delay: 0.25s;
      }
      .speed-line-mobile:nth-child(3) {
        top: 65%;
        width: 75%;
        left: -75%;
        animation-delay: 0.5s;
      }
      .speed-line-mobile:nth-child(4) {
        top: 85%;
        width: 80%;
        left: -80%;
        animation-delay: 0.75s;
      }

      @keyframes speed-rush-mobile {
        0% {
          transform: translateX(0);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateX(calc(100vw + 100%));
          opacity: 0;
        }
      }

      .cta-button-mobile {
        position: absolute;
        bottom: 180px;
        right: 70px;
        background: #ffffff;
        color: #ff416c;
        padding: 30px 55px;
        border-radius: 18px;
        font-size: 40px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 3px;
        box-shadow:
          0 18px 45px rgba(0, 0, 0, 0.5),
          0 0 60px rgba(255, 255, 255, 0.4);
        z-index: 15;
        animation: cta-pulse-mobile 1.8s ease-in-out infinite;
      }

      @keyframes cta-pulse-mobile {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }
    </style>
  </head>

  <body>
    <div class="speed-lines-mobile">
      <div class="speed-line-mobile"></div>
      <div class="speed-line-mobile"></div>
      <div class="speed-line-mobile"></div>
      <div class="speed-line-mobile"></div>
    </div>

    <div class="warning-stripes-mobile"></div>

    {% if badge %}
    <div class="badge-urgency-mobile">{{ badge }}</div>
    {% endif %}

    <div class="container-mobile">
      <div class="timer-box-mobile">
        <div class="timer-label-mobile">LIMITED TIME</div>
        <div class="timer-display-mobile">{{ timer_text | default('ACT NOW') }}</div>
      </div>

      <div class="title-urgent-mobile">{{ title }}</div>

      {% if subtitle %}
      <div class="subtitle-urgent-mobile">{{ subtitle }}</div>
      {% endif %}
    </div>

    <div class="alert-icons-mobile">
      <div class="alert-icon-mobile">🚨</div>
      <div class="alert-icon-mobile">⚠️</div>
      <div class="alert-icon-mobile">🔥</div>
    </div>

    <div class="cta-button-mobile">{{ cta_text | default('WATCH NOW') }}</div>
  </body>
</html>
