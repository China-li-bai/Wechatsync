<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{ width }}px;
            height: {{ height }}px;
            background: {{ background | default('linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%)') }};
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 70px;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }
        
        .timer-box {
            background: rgba(0, 0, 0, 0.9);
            border: 5px solid {{ accent_color | default('#FFD700') }};
            border-radius: 20px;
            padding: 25px 50px;
            margin-bottom: 35px;
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.6),
                0 0 80px rgba(255, 215, 0, 0.3),
                inset 0 0 30px rgba(255, 215, 0, 0.1);
            animation: timer-glow 1s ease-in-out infinite alternate;
        }
        
        @keyframes timer-glow {
            0% { 
                box-shadow: 
                    0 15px 40px rgba(0, 0, 0, 0.6),
                    0 0 80px rgba(255, 215, 0, 0.3),
                    inset 0 0 30px rgba(255, 215, 0, 0.1);
            }
            100% { 
                box-shadow: 
                    0 15px 40px rgba(0, 0, 0, 0.6),
                    0 0 120px rgba(255, 215, 0, 0.6),
                    inset 0 0 50px rgba(255, 215, 0, 0.2);
            }
        }
        
        .timer-label {
            font-size: 24px;
            color: {{ accent_color | default('#FFD700') }};
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .timer-display {
            font-size: 72px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 5px;
            animation: countdown-pulse 1s ease-in-out infinite;
        }
        
        @keyframes countdown-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        
        .title-urgent {
            font-size: {{ font_size | default(68) }}px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.15;
            max-width: 95%;
            word-wrap: break-word;
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                5px 5px 0px #000000,
                -2px -2px 0px #000000,
                2px -2px 0px #000000,
                -2px 2px 0px #000000,
                0 0 40px rgba(0, 0, 0, 0.7);
        }
        
        {% if subtitle %}
        .subtitle-urgent {
            font-size: {{ (font_size // 2) + 2 | default(34) }}px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.3;
            max-width: 90%;
            background: rgba(0, 0, 0, 0.75);
            padding: 18px 30px;
            border-radius: 12px;
            border-left: 6px solid {{ accent_color | default('#FFD700') }};
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
        }
        {% endif %}
        
        {% if badge %}
        .badge-urgency {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFD700 0%, #FF4500 100%);
            color: #000000;
            padding: 18px 55px;
            border-radius: 50px;
            font-size: 34px;
            font-weight: 900;
            box-shadow: 
                0 10px 35px rgba(255, 69, 0, 0.7),
                0 0 60px rgba(255, 215, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 4px;
            z-index: 20;
            animation: urgency-shake 0.8s ease-in-out infinite;
        }
        
        @keyframes urgency-shake {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-2deg); }
            75% { transform: translateX(-50%) rotate(2deg); }
        }
        {% endif %}
        
        .warning-stripes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(
                45deg,
                #FFD700,
                #FFD700 20px,
                #000000 20px,
                #000000 40px
            );
            z-index: 15;
            animation: stripes-move 1s linear infinite;
        }
        
        @keyframes stripes-move {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }
        
        .alert-icons {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 10;
        }
        
        .alert-icon {
            font-size: 45px;
            animation: alert-bounce 1s ease-in-out infinite;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.5));
        }
        
        .alert-icon:nth-child(1) { animation-delay: 0s; }
        .alert-icon:nth-child(2) { animation-delay: 0.2s; }
        .alert-icon:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes alert-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.15); }
        }
        
        .speed-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .speed-line {
            position: absolute;
            height: 3px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: speed-rush 0.8s linear infinite;
        }
        
        .speed-line:nth-child(1) { top: 20%; width: 60%; left: -60%; animation-delay: 0s; }
        .speed-line:nth-child(2) { top: 40%; width: 80%; left: -80%; animation-delay: 0.2s; }
        .speed-line:nth-child(3) { top: 60%; width: 70%; left: -70%; animation-delay: 0.4s; }
        .speed-line:nth-child(4) { top: 80%; width: 65%; left: -65%; animation-delay: 0.6s; }
        
        @keyframes speed-rush {
            0% { transform: translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(calc(100vw + 100%)); opacity: 0; }
        }
        
        .cta-button {
            position: absolute;
            bottom: 110px;
            right: 50px;
            background: #FFFFFF;
            color: #FF416C;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(255, 255, 255, 0.3);
            z-index: 15;
            animation: cta-pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes cta-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body>
    <div class="speed-lines">
        <div class="speed-line"></div>
        <div class="speed-line"></div>
        <div class="speed-line"></div>
        <div class="speed-line"></div>
    </div>
    
    <div class="warning-stripes"></div>
    
    {% if badge %}
    <div class="badge-urgency">{{ badge }}</div>
    {% endif %}
    
    <div class="container">
        <div class="timer-box">
            <div class="timer-label">⏰ Limited Time</div>
            <div class="timer-display">{{ timer_text | default('⚡ ACT NOW ⚡') }}</div>
        </div>
        
        <div class="title-urgent">{{ title }}</div>
        
        {% if subtitle %}
        <div class="subtitle-urgent">{{ subtitle }}</div>
        {% endif %}
    </div>
    
    <div class="alert-icons">
        <div class="alert-icon">🚨</div>
        <div class="alert-icon">⚠️</div>
        <div class="alert-icon">🔥</div>
    </div>
    
    <div class="cta-button">{{ cta_text | default('WATCH NOW!' )}}</div>
</body>
</html>
