<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: {{ width | default(1080) }}px;
        height: {{ height | default(1920) }}px;
        background: {{ background | default('linear-gradient(180deg, #FF0844 0%, #FFB199 100%)') }};
        font-family: 'Impact', 'Arial Black', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        overflow: hidden;
        position: relative;
        padding: 100px 80px;
      }

      .bg-texture {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: 
          radial-gradient(circle at 20% 20%, rgba(255,255,255,0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(255,255,255,0.08) 0%, transparent 50%);
        pointer-events: none;
        z-index: 1;
      }

      .top-section {
        flex: 0 0 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }

      {% if badge %}
      .badge-viral-mobile {
        background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
        color: #1a1a1a;
        padding: 22px 55px;
        border-radius: 60px;
        font-size: 44px;
        font-weight: 900;
        box-shadow:
          0 8px 30px rgba(255, 215, 0, 0.4),
          0 2px 8px rgba(0, 0, 0, 0.15);
        text-transform: uppercase;
        letter-spacing: 3px;
        animation: badge-pulse-mobile 3s ease-in-out infinite;
        transform: rotate(-1deg);
        margin-bottom: 50px;
        border: 3px solid rgba(255, 255, 255, 0.3);
      }

      @keyframes badge-pulse-mobile {
        0%,
        100% {
          transform: rotate(-1deg) scale(1);
        }
        50% {
          transform: rotate(-1deg) scale(1.03);
        }
      }
      {% endif %}

      .middle-section {
        flex: 1 1 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        padding: 60px 0;
      }

      .emoji-mega-mobile {
        font-size: 280px;
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
        animation: subtle-bounce-mobile 2.5s ease-in-out infinite;
        line-height: 1;
        margin-bottom: 60px;
        opacity: 0.95;
      }

      @keyframes subtle-bounce-mobile {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-8px) scale(1.02);
        }
      }

      .title-wrapper-mobile {
        text-align: center;
        max-width: 92%;
        position: relative;
      }

      .title-mobile {
        font-size: {{ (font_size | default(75)) * 1.15 }}px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.3;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow:
          4px 4px 12px rgba(0, 0, 0, 0.4),
          0 0 40px rgba(0, 0, 0, 0.2);
        word-wrap: break-word;
        margin-bottom: 40px;
        position: relative;
        z-index: 2;
      }

      {% if subtitle %}
      .subtitle-box-mobile {
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(20px);
        padding: 24px 36px;
        border-radius: 20px;
        border-left: 5px solid {{ accent_color | default('#FFD700') }};
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        max-width: 90%;
      }

      .subtitle-mobile {
        font-size: {{ ((font_size | default(75)) // 2 + 6) * 1.2 }}px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.95);
        line-height: 1.5;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      {% endif %}

      .bottom-section {
        flex: 0 0 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }

      .impact-text-mobile {
        font-size: 36px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        text-transform: uppercase;
        letter-spacing: 8px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        margin-top: 40px;
        opacity: 0.9;
      }

      .decorative-accent {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 2;
      }

      .glow-orb {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
        animation: orb-float 6s ease-in-out infinite;
      }

      .glow-orb:nth-child(1) {
        top: 15%;
        left: 10%;
        animation-delay: 0s;
      }

      .glow-orb:nth-child(2) {
        bottom: 20%;
        right: 8%;
        animation-delay: 3s;
      }

      @keyframes orb-float {
        0%,
        100% {
          transform: scale(1) translateY(0);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.1) translateY(-20px);
          opacity: 1;
        }
      }

      .corner-accent {
        position: absolute;
        width: 120px;
        height: 120px;
        border: 3px solid rgba(255, 215, 0, 0.25);
        border-radius: 50%;
        opacity: 0.6;
      }

      .corner-accent:nth-child(3) {
        top: 8%;
        right: 12%;
      }

      .corner-accent:nth-child(4) {
        bottom: 12%;
        left: 10%;
      }
    </style>
  </head>

  <body>
    <div class="bg-texture"></div>
    
    <div class="decorative-accent">
      <div class="glow-orb"></div>
      <div class="glow-orb"></div>
      <div class="corner-accent"></div>
      <div class="corner-accent"></div>
    </div>

    <div class="top-section">
      {% if badge %}
      <div class="badge-viral-mobile">{{ badge }}</div>
      {% endif %}
    </div>

    <div class="middle-section">
      <div class="emoji-mega-mobile">{{ emoji | default('😱') }}</div>

      <div class="title-wrapper-mobile">
        <div class="title-mobile">{{ title }}</div>
      </div>

      {% if subtitle %}
      <div class="subtitle-box-mobile">
        <div class="subtitle-mobile">{{ subtitle }}</div>
      </div>
      {% endif %}
    </div>

    <div class="bottom-section">
      <div class="impact-text-mobile">
        {{ impact_text | default('MUST WATCH') }}
      </div>
    </div>
  </body>
</html>
