<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: {{ width | default(1080) }}px;
        height: {{ height | default(1920) }}px;
        background: {{ background | default('linear-gradient(180deg, #FF0844 0%, #FFB199 100%)') }};
        font-family: 'Impact', 'Arial Black', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        overflow: hidden;
        position: relative;
        padding: 80px 60px;
      }

      .top-section {
        flex: 0 0 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }

      {% if badge %}
      .badge-viral-mobile {
        background: linear-gradient(135deg, #ffd700 0%, #ffa500 100%);
        color: #000000;
        padding: 25px 60px;
        border-radius: 50px;
        font-size: 48px;
        font-weight: 900;
        box-shadow:
          0 15px 40px rgba(255, 215, 0, 0.6),
          0 0 80px rgba(255, 215, 0, 0.4);
        text-transform: uppercase;
        letter-spacing: 4px;
        animation: badge-pulse-mobile 2s ease-in-out infinite;
        transform: rotate(-2deg);
        margin-bottom: 40px;
      }

      @keyframes badge-pulse-mobile {
        0%,
        100% {
          transform: rotate(-2deg) scale(1);
        }
        50% {
          transform: rotate(-2deg) scale(1.08);
        }
      }
      {% endif %}

      .middle-section {
        flex: 1 1 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        padding: 40px 0;
      }

      .emoji-mega-mobile {
        font-size: 320px;
        filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.5));
        animation: shake-mobile 0.5s ease-in-out infinite;
        line-height: 1;
        margin-bottom: 50px;
      }

      @keyframes shake-mobile {
        0%,
        100% {
          transform: rotate(0deg) scale(1);
        }
        25% {
          transform: rotate(-5deg) scale(1.05);
        }
        75% {
          transform: rotate(5deg) scale(1.05);
        }
      }

      .title-wrapper-mobile {
        text-align: center;
        max-width: 95%;
      }

      .title-mobile {
        font-size: {{ (font_size | default(75)) * 1.4 }}px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.25;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-shadow:
          8px 8px 0px #000000,
          -3px -3px 0px #000000,
          3px -3px 0px #000000,
          -3px 3px 0px #000000,
          0 0 60px rgba(0, 0, 0, 0.8);
        word-wrap: break-word;
        margin-bottom: 35px;
      }

      {% if subtitle %}
      .subtitle-box-mobile {
        background: rgba(0, 0, 0, 0.88);
        padding: 28px 42px;
        border-radius: 16px;
        border-left: 8px solid {{ accent_color | default('#FFD700') }};
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
        max-width: 92%;
      }

      .subtitle-mobile {
        font-size: {{ ((font_size | default(75)) // 2 + 5) * 1.3 }}px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.4;
        text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.9);
        text-align: center;
      }
      {% endif %}

      .bottom-section {
        flex: 0 0 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }

      .impact-text-mobile {
        font-size: 42px;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.95);
        text-transform: uppercase;
        letter-spacing: 10px;
        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        margin-top: 30px;
      }

      .explosion-bg-mobile {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1;
      }

      .burst-mobile {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 800px;
        height: 800px;
        transform: translate(-50%, -50%);
      }

      .burst-line-mobile {
        position: absolute;
        width: 8px;
        height: 250px;
        background: linear-gradient(to top, transparent, {{ accent_color | default('#FFD700') }}, transparent);
        top: 50%;
        left: 50%;
        transform-origin: bottom center;
        animation: burst-out-mobile 2s ease-out infinite;
      }

      .burst-line-mobile:nth-child(1) {
        transform: translate(-50%, -100%) rotate(0deg);
        animation-delay: 0s;
      }
      .burst-line-mobile:nth-child(2) {
        transform: translate(-50%, -100%) rotate(45deg);
        animation-delay: 0.15s;
      }
      .burst-line-mobile:nth-child(3) {
        transform: translate(-50%, -100%) rotate(90deg);
        animation-delay: 0.3s;
      }
      .burst-line-mobile:nth-child(4) {
        transform: translate(-50%, -100%) rotate(135deg);
        animation-delay: 0.45s;
      }
      .burst-line-mobile:nth-child(5) {
        transform: translate(-50%, -100%) rotate(180deg);
        animation-delay: 0.6s;
      }
      .burst-line-mobile:nth-child(6) {
        transform: translate(-50%, -100%) rotate(225deg);
        animation-delay: 0.75s;
      }
      .burst-line-mobile:nth-child(7) {
        transform: translate(-50%, -100%) rotate(270deg);
        animation-delay: 0.9s;
      }
      .burst-line-mobile:nth-child(8) {
        transform: translate(-50%, -100%) rotate(315deg);
        animation-delay: 1.05s;
      }

      @keyframes burst-out-mobile {
        0% {
          opacity: 0;
          height: 0;
        }
        30% {
          opacity: 1;
          height: 250px;
        }
        100% {
          opacity: 0;
          height: 250px;
        }
      }

      .sparkle-star-mobile {
        position: absolute;
        width: 55px;
        height: 55px;
        background: #ffffff;
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        animation: star-twinkle-mobile 1.5s ease-in-out infinite;
        z-index: 5;
      }

      .sparkle-star-mobile:nth-child(1) {
        top: 12%;
        left: 10%;
        animation-delay: 0s;
      }
      .sparkle-star-mobile:nth-child(2) {
        top: 18%;
        right: 10%;
        animation-delay: 0.4s;
      }
      .sparkle-star-mobile:nth-child(3) {
        bottom: 20%;
        left: 12%;
        animation-delay: 0.8s;
      }
      .sparkle-star-mobile:nth-child(4) {
        bottom: 15%;
        right: 12%;
        animation-delay: 1.2s;
      }
      .sparkle-star-mobile:nth-child(5) {
        top: 40%;
        left: 6%;
        animation-delay: 0.6s;
        width: 35px;
        height: 35px;
      }
      .sparkle-star-mobile:nth-child(6) {
        top: 45%;
        right: 6%;
        animation-delay: 1s;
        width: 35px;
        height: 35px;
      }

      @keyframes star-twinkle-mobile {
        0%,
        100% {
          opacity: 0;
          transform: scale(0) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(1.2) rotate(180deg);
        }
      }

      .lightning-mobile {
        position: absolute;
        top: 22%;
        left: 20%;
        font-size: 90px;
        color: #ffd700;
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        animation: flash-mobile 2s ease-in-out infinite;
        z-index: 3;
      }

      @keyframes flash-mobile {
        0%,
        90%,
        100% {
          opacity: 0;
          transform: scale(0.8);
        }
        92%,
        96% {
          opacity: 1;
          transform: scale(1.2);
        }
        94% {
          opacity: 0.5;
          transform: scale(1);
        }
      }

      .emoji-float-mobile {
        position: absolute;
        font-size: 70px;
        animation: emoji-bounce-mobile 1.5s ease-in-out infinite;
        z-index: 6;
      }

      .emoji-float-mobile:nth-child(1) {
        top: 15%;
        right: 15%;
        animation-delay: 0s;
      }
      .emoji-float-mobile:nth-child(2) {
        bottom: 25%;
        left: 12%;
        animation-delay: 0.5s;
      }
      .emoji-float-mobile:nth-child(3) {
        top: 35%;
        left: 8%;
        animation-delay: 1s;
      }

      @keyframes emoji-bounce-mobile {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
        }
        50% {
          transform: scale(1.3) rotate(15deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="explosion-bg-mobile">
      <div class="burst-mobile">
        <div class="burst-line-mobile"></div>
        <div class="burst-line-mobile"></div>
        <div class="burst-line-mobile"></div>
        <div class="burst-line-mobile"></div>
        <div class="burst-line-mobile"></div>
        <div class="burst-line-mobile"></div>
        <div class="burst-line-mobile"></div>
        <div class="burst-line-mobile"></div>
      </div>
    </div>

    <div class="sparkle-star-mobile"></div>
    <div class="sparkle-star-mobile"></div>
    <div class="sparkle-star-mobile"></div>
    <div class="sparkle-star-mobile"></div>
    <div class="sparkle-star-mobile"></div>
    <div class="sparkle-star-mobile"></div>

    <div class="lightning-mobile">⚡</div>

    <div class="emoji-float-mobile">😱</div>
    <div class="emoji-float-mobile">🔥</div>
    <div class="emoji-float-mobile">💥</div>

    <div class="top-section">
      {% if badge %}
      <div class="badge-viral-mobile">{{ badge }}</div>
      {% endif %}
    </div>

    <div class="middle-section">
      <div class="emoji-mega-mobile">{{ emoji | default('😱') }}</div>

      <div class="title-wrapper-mobile">
        <div class="title-mobile">{{ title }}</div>
      </div>

      {% if subtitle %}
      <div class="subtitle-box-mobile">
        <div class="subtitle-mobile">{{ subtitle }}</div>
      </div>
      {% endif %}
    </div>

    <div class="bottom-section">
      <div class="impact-text-mobile">
        {{ impact_text | default('MUST WATCH') }}
      </div>
    </div>
  </body>
</html>
