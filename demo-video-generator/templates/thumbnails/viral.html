<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          width: {{ width }}px;
          height: {{ height }}px;
          background: {{ background | default('linear-gradient(135deg, #FF0844 0%, #FFB199 100%)') }};
          font-family: 'Impact', 'Arial Black', sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          overflow: hidden;
          position: relative;
      }

      .container {
          display: flex;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          padding: 50px 60px;
          width: 100%;
          height: 100%;
          position: relative;
          z-index: 10;
      }

      .left-section {
          flex: 1.2;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          justify-content: center;
          padding-right: 30px;
      }

      .right-section {
          flex: 0 0 380px;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
      }

      .emoji-mega {
          font-size: 280px;
          filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
          animation: shake 0.5s ease-in-out infinite;
          line-height: 1;
      }

      @keyframes shake {
          0%, 100% { transform: rotate(0deg) scale(1); }
          25% { transform: rotate(-5deg) scale(1.05); }
          75% { transform: rotate(5deg) scale(1.05); }
      }

      .title-wrapper {
          position: relative;
          display: inline-block;
      }

      .title {
          font-size: {{ font_size | default(75) }}px;
          font-weight: 900;
          color: #FFFFFF;
          line-height: 1.15;
          text-transform: uppercase;
          letter-spacing: 3px;
          text-shadow:
              6px 6px 0px #000000,
              -2px -2px 0px #000000,
              2px -2px 0px #000000,
              -2px 2px 0px #000000,
              0px 8px 20px rgba(0, 0, 0, 0.8);
          max-width: 100%;
          word-wrap: break-word;
          margin-bottom: 25px;
          position: relative;
          z-index: 2;
      }

      {% if subtitle %}
      .subtitle-box {
          background: rgba(0, 0, 0, 0.85);
          padding: 18px 28px;
          border-radius: 12px;
          border-left: 6px solid {{ accent_color | default('#FFD700') }};
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          max-width: 95%;
      }

      .subtitle {
          font-size: {{ (font_size // 2) + 5 | default(38) }}px;
          font-weight: 700;
          color: #FFFFFF;
          line-height: 1.3;
          text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      }
      {% endif %}

      {% if badge %}
      .badge-viral {
          position: absolute;
          top: 35px;
          left: 35px;
          background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
          color: #000000;
          padding: 18px 45px;
          border-radius: 50px;
          font-size: 36px;
          font-weight: 900;
          box-shadow:
              0 10px 30px rgba(255, 215, 0, 0.6),
              0 0 60px rgba(255, 215, 0, 0.4),
              inset 0 -4px 0 rgba(0, 0, 0, 0.2);
          text-transform: uppercase;
          letter-spacing: 3px;
          z-index: 20;
          animation: badge-pulse 1.5s ease-in-out infinite;
          transform: rotate(-3deg);
      }

      @keyframes badge-pulse {
          0%, 100% {
              transform: rotate(-3deg) scale(1);
              box-shadow:
                  0 10px 30px rgba(255, 215, 0, 0.6),
                  0 0 60px rgba(255, 215, 0, 0.4);
          }
          50% {
              transform: rotate(-3deg) scale(1.08);
              box-shadow:
                  0 15px 40px rgba(255, 215, 0, 0.8),
                  0 0 80px rgba(255, 215, 0, 0.6);
          }
      }
      {% endif %}

      .explosion-bg {
          position: absolute;
          width: 100%;
          height: 100%;
          top: 0;
          left: 0;
          pointer-events: none;
          z-index: 1;
      }

      .burst {
          position: absolute;
          top: 50%;
          right: 15%;
          width: 500px;
          height: 500px;
          transform: translate(50%, -50%);
      }

      .burst-line {
          position: absolute;
          width: 6px;
          height: 150px;
          background: linear-gradient(to top, transparent, {{ accent_color | default('#FFD700') }}, transparent);
          top: 50%;
          left: 50%;
          transform-origin: bottom center;
          animation: burst-out 2s ease-out infinite;
      }

      .burst-line:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); animation-delay: 0s; }
      .burst-line:nth-child(2) { transform: translate(-50%, -100%) rotate(45deg); animation-delay: 0.15s; }
      .burst-line:nth-child(3) { transform: translate(-50%, -100%) rotate(90deg); animation-delay: 0.3s; }
      .burst-line:nth-child(4) { transform: translate(-50%, -100%) rotate(135deg); animation-delay: 0.45s; }
      .burst-line:nth-child(5) { transform: translate(-50%, -100%) rotate(180deg); animation-delay: 0.6s; }
      .burst-line:nth-child(6) { transform: translate(-50%, -100%) rotate(225deg); animation-delay: 0.75s; }
      .burst-line:nth-child(7) { transform: translate(-50%, -100%) rotate(270deg); animation-delay: 0.9s; }
      .burst-line:nth-child(8) { transform: translate(-50%, -100%) rotate(315deg); animation-delay: 1.05s; }

      @keyframes burst-out {
          0% {
              opacity: 0;
              height: 0;
          }
          30% {
              opacity: 1;
              height: 150px;
          }
          100% {
              opacity: 0;
              height: 150px;
          }
      }

      .sparkle-star {
          position: absolute;
          width: 40px;
          height: 40px;
          background: #FFFFFF;
          clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
          animation: star-twinkle 1.5s ease-in-out infinite;
          z-index: 5;
      }

      .sparkle-star:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; }
      .sparkle-star:nth-child(2) { top: 20%; right: 12%; animation-delay: 0.4s; }
      .sparkle-star:nth-child(3) { bottom: 15%; left: 15%; animation-delay: 0.8s; }
      .sparkle-star:nth-child(4) { bottom: 25%; right: 8%; animation-delay: 1.2s; }
      .sparkle-star:nth-child(5) { top: 45%; left: 5%; animation-delay: 0.6s; width: 25px; height: 25px; }
      .sparkle-star:nth-child(6) { top: 55%; right: 5%; animation-delay: 1s; width: 25px; height: 25px; }

      @keyframes star-twinkle {
          0%, 100% {
              opacity: 0;
              transform: scale(0) rotate(0deg);
          }
          50% {
              opacity: 1;
              transform: scale(1.2) rotate(180deg);
          }
      }

      .lightning {
          position: absolute;
          top: 15%;
          left: 25%;
          font-size: 60px;
          color: #FFD700;
          text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
          animation: flash 2s ease-in-out infinite;
          z-index: 3;
      }

      @keyframes flash {
          0%, 90%, 100% { opacity: 0; transform: scale(0.8); }
          92%, 96% { opacity: 1; transform: scale(1.2); }
          94% { opacity: 0.5; transform: scale(1); }
      }

      .impact-text {
          position: absolute;
          bottom: 45px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 28px;
          font-weight: 900;
          color: rgba(255, 255, 255, 0.9);
          text-transform: uppercase;
          letter-spacing: 8px;
          text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
          z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="explosion-bg">
      <div class="burst">
        <div class="burst-line"></div>
        <div class="burst-line"></div>
        <div class="burst-line"></div>
        <div class="burst-line"></div>
        <div class="burst-line"></div>
        <div class="burst-line"></div>
        <div class="burst-line"></div>
        <div class="burst-line"></div>
      </div>
    </div>

    <div class="sparkle-star"></div>
    <div class="sparkle-star"></div>
    <div class="sparkle-star"></div>
    <div class="sparkle-star"></div>
    <div class="sparkle-star"></div>
    <div class="sparkle-star"></div>

    <div class="lightning">⚡</div>

    {% if badge %}
    <div class="badge-viral">{{ badge }}</div>
    {% endif %}

    <div class="container">
      <div class="left-section">
        <div class="title-wrapper">
          <div class="title">{{ title }}</div>
        </div>

        {% if subtitle %}
        <div class="subtitle-box">
          <div class="subtitle">{{ subtitle }}</div>
        </div>
        {% endif %}
      </div>

      <div class="right-section">
        <div class="emoji-mega">{{ emoji | default('😱') }}</div>
      </div>
    </div>

    <div class="impact-text">
      {{ impact_text | default('🔥 MUST WATCH 🔥') }}
    </div>
  </body>
</html>
